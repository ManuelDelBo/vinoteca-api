<div class="register-container">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <h1>Crear cuenta</h1>
        <p>Completá tus datos para registrarte.</p>

        <div class="form-group">
            <label for="name">Nombre</label>
            <input id="name" type="text" formControlName="name" placeholder="Ingresá tu nombre" />
            <small *ngIf="registerForm.get('name')?.touched && registerForm.get('name')?.hasError('required')">
                El nombre es obligatorio.
            </small>
        </div>

        <div class="form-group">
            <label for="lastName">Apellido</label>
            <input id="lastName" type="text" formControlName="lastName" placeholder="Ingresá tu apellido" />
            <small *ngIf="registerForm.get('lastName')?.touched && registerForm.get('lastName')?.hasError('required')">
                El apellido es obligatorio.
            </small>
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input id="email" type="email" formControlName="email" placeholder="ejemplo@correo.com" />
            <small *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.hasError('required')">
                El correo electrónico es obligatorio.
            </small>
            <small *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.hasError('email')">
                Ingresá un correo electrónico válido.
            </small>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input id="password" type="password" formControlName="password" placeholder="Mínimo 6 caracteres" />
            <small *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.hasError('required')">
                La contraseña es obligatoria.
            </small>
            <small *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.hasError('minlength')">
                La contraseña debe tener al menos 6 caracteres.
            </small>
        </div>

        <button type="submit">Registrarme</button>

        <p>
            ¿Ya tenés una cuenta?
            <a routerLink="/login">Iniciá sesión</a>
        </p>
    </form>
</div>
