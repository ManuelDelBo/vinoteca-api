<div class="login-container">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <h1>Iniciar sesión</h1>

        <label for="username">Usuario o email</label>
        <input id="username" type="text" formControlName="username" placeholder="Ingresá tu usuario" autocomplete="username" />
        @if (loginForm.get('username')?.touched && loginForm.get('username')?.invalid) {
        <small>El usuario es obligatorio.</small>
        }

        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="Ingresá tu contraseña" autocomplete="current-password" />
        @if (loginForm.get('password')?.touched && loginForm.get('password')?.invalid) {
        <small>La contraseña es obligatoria.</small>
        }

        <button type="submit">Ingresar</button>

        <p>
            ¿No tenés cuenta?
            <a routerLink="/register">Registrate</a>
        </p>
    </form>
</div>
