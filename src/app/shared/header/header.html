<header class="header">
    <a routerLink="/" class="brand">
        Vinoteca <span>HTTP</span>
    </a>

    <nav class="nav" aria-label="Navegación principal">
        <a
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link">
            Home
        </a>

        <a
            routerLink="/products"
            routerLinkActive="active"
            class="nav-link">
            Productos
        </a>

        @if (isCustomer) {
        <a
            routerLink="/cart"
            routerLinkActive="active"
            class="nav-icon-link cart-link"
            aria-label="Mi carrito"
            title="Mi carrito">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <circle cx="9" cy="21" r="1" />
                <circle cx="20" cy="21" r="1" />
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
            </svg>
            <span class="sr-only">Mi carrito</span>
        </a>
        }

        @if (isAdminOrEmployee) {
        <a routerLink="/management" class="management-link">
            <span>Gestión interna</span>
        </a>
        }

        @if (loggedIn$ | async) {
        <div class="profile-menu" #profileMenu (keydown)="onProfileMenuKeydown($event)">
            <button
                type="button"
                class="nav-icon-link profile-toggle"
                [class.is-open]="profileMenuOpen()"
                (click)="toggleProfileMenu()"
                [attr.aria-expanded]="profileMenuOpen()"
                aria-haspopup="menu"
                aria-controls="profile-dropdown"
                aria-label="Menú de perfil"
                title="Mi cuenta">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
                <span class="sr-only">Mi cuenta</span>
            </button>

            @if (profileMenuOpen()) {
            <div class="profile-dropdown" id="profile-dropdown" role="menu"
                aria-label="Menú de perfil">
                <a
                    routerLink="/profile"
                    role="menuitem"
                    class="dropdown-item"
                    (click)="closeProfileMenu()">
                    Mi perfil
                </a>

                @if (isCustomer) {
                <a
                    routerLink="/orders"
                    role="menuitem"
                    class="dropdown-item"
                    (click)="closeProfileMenu()">
                    Mis pedidos
                </a>

                <a
                    [routerLink]="['/profile']"
                    [queryParams]="{ edit: '1' }"
                    role="menuitem"
                    class="dropdown-item"
                    (click)="closeProfileMenu()">
                    Editar perfil
                </a>
                }

                <div class="dropdown-divider" role="separator"></div>

                <button
                    type="button"
                    role="menuitem"
                    class="dropdown-item dropdown-logout"
                    (click)="requestLogout()">
                    Salir
                </button>
            </div>
            }
        </div>
        } @else {
        <a routerLink="/login" class="login-link">
            Iniciar sesión
        </a>

        <a routerLink="/register" class="register-link">
            Registrarse
        </a>
        }

        <button
            type="button"
            class="theme-toggle"
            (click)="themeService.toggleTheme()"
            [attr.aria-label]="themeService.theme() === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro'"
            [attr.title]="themeService.theme() === 'dark' ? 'Modo claro' : 'Modo oscuro'">
            @if (themeService.theme() === 'dark') {
            <!-- Sol: permite volver al modo claro -->
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path
                    d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
            </svg>
            } @else {
            <!-- Luna: permite activar el modo oscuro -->
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" />
            </svg>
            }
        </button>
    </nav>

    @if (showLogoutDialog()) {
    <app-confirm-dialog title="Cerrar sesión" message="¿Querés cerrar tu sesión?"
        detail="Vas a tener que volver a iniciar sesión para acceder a tu cuenta."
        confirmLabel="Cerrar sesión" cancelLabel="Cancelar" (confirmed)="confirmLogout()"
        (cancelled)="cancelLogout()" />
    }
</header>
