<header class="header">
    <a routerLink="/" class="brand">
        Vinoteca <span>HTTP</span>
    </a>

    <nav class="nav">
        <a routerLink="/" class="nav-link">
            Home
        </a>

        <a routerLink="/products" class="nav-link">
            Productos
        </a>

        <!-- CUSTOMER -->
        <a
            *ngIf="isCustomer"
            routerLink="/cart"
            class="nav-link"
        >
            Mi carrito
        </a>

        <!-- ADMIN y EMPLOYEE -->
        <a
            *ngIf="isAdminOrEmployee"
            routerLink="/management"
            class="management-link"
        >
            <span>Gestión interna</span>
        </a>

        <!-- GUEST -->
        <ng-container *ngIf="!(loggedIn$ | async)">
            <a routerLink="/login" class="nav-link">
                Iniciar sesión
            </a>

            <a routerLink="/register" class="register-link">
                Registrarse
            </a>
        </ng-container>

        <!-- Usuarios autenticados -->
        <a
            *ngIf="loggedIn$ | async"
            routerLink="/profile"
            class="nav-link"
        >
            Mi perfil
        </a>

        <button
            *ngIf="loggedIn$ | async"
            type="button"
            class="logout-button"
            (click)="onLogout()"
        >
            Salir
        </button>
        
        <button
            type="button"
            class="theme-toggle"
            (click)="themeService.toggleTheme()"
            [attr.aria-label]="themeService.theme() === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro'"
            [attr.title]="themeService.theme() === 'dark' ? 'Modo claro' : 'Modo oscuro'"
            >
            @if (themeService.theme() === 'dark') {
                <!-- Sol: permite volver al modo claro -->
                <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                >
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
                </svg>
            } @else {
                <!-- Luna: permite activar el modo oscuro -->
                <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                >
                <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" />
                </svg>
            }
        </button>

    </nav>
</header>
