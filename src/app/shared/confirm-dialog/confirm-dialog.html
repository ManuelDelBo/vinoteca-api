<div class="dialog-backdrop" (click)="onCancel()">
    <div class="dialog-card" role="dialog" aria-modal="true" [attr.aria-label]="title"
        (click)="$event.stopPropagation()">

        <div class="dialog-icon" aria-hidden="true">!</div>

        <h2>{{ title }}</h2>

        <p class="dialog-message">{{ message }}</p>

        @if (detail) {
        <p class="dialog-detail">{{ detail }}</p>
        }

        @if (warning) {
        <div class="dialog-warning">{{ warning }}</div>
        }

        <div class="dialog-actions">
            <button type="button" class="btn-cancel" [disabled]="busy" (click)="onCancel()">
                {{ cancelLabel }}
            </button>

            <button type="button" class="btn-confirm" [disabled]="busy" (click)="onConfirm()">
                {{ busy ? 'Procesando...' : confirmLabel }}
            </button>
        </div>

    </div>
</div>
