<div class="dialog-backdrop">
    <div #dialogCard [class]="'dialog-card variant-' + variant" role="dialog" aria-modal="true"
        [attr.aria-label]="title">

        <div class="dialog-icon" aria-hidden="true">{{ icon }}</div>

        <h2 [id]="dialogTitleId">{{ title }}</h2>

        @if (message) {
        <p class="dialog-message">{{ message }}</p>
        }

        @if (detail) {
        <p class="dialog-detail">{{ detail }}</p>
        }

        @if (warning) {
        <div class="dialog-warning">{{ warning }}</div>
        }

        <div class="dialog-actions">
            @if (showCancel) {
            <button #cancelButton type="button" class="btn-cancel" [disabled]="busy" (click)="onCancel()">
                {{ cancelLabel }}
            </button>
            }

            <button #confirmButton type="button" class="btn-confirm" [disabled]="busy" (click)="onConfirm()">
                {{ busy ? 'Procesando...' : confirmLabel }}
            </button>
        </div>

    </div>
</div>
